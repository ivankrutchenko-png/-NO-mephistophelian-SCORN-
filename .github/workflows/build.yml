name: Build and Run C++ Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile with g++ (C++20)
        run: |
          g++ -std=c++20 -Iinclude main.cpp -o patristic_engine

      - name: Execute Semantic Engine
        run: |
          ./patristic_engine
